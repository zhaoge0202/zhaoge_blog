name: Deploy VuePress site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VUEPRESS_BASE: ${{ vars.VUEPRESS_BASE || '/zhaoge_blog/' }}
      VUEPRESS_HOSTNAME: ${{ vars.VUEPRESS_HOSTNAME || 'https://zhaoge0202.github.io/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Prettier + markdownlint)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build VuePress site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare edge cache
        # 新站点上线后清掉 Cloudflare 边缘缓存的旧 HTML/资源，让国内访问立刻拿到新版。
        # 未配置 secrets 时自动跳过；purge 失败只告警、不影响已完成的部署。
        if: ${{ secrets.CF_API_TOKEN != '' && secrets.CF_ZONE_ID != '' }}
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          code=$(curl -s -o /tmp/purge.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "Cloudflare purge HTTP ${code}"
          cat /tmp/purge.json
          [ "${code}" = "200" ] || echo "::warning::Cloudflare purge failed; site still deployed, edge cache will expire by TTL"
